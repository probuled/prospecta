name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            ui
            config
            refactor
            style
            docs
            build
            ci
            chore
            revert
          subjectPattern: ^[^A-Z].*[^.]$
          subjectPatternError: 'A descrição deve começar em minúscula e não terminar com ponto.'
