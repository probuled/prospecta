<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prospecta</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ouro { fill:var(--ouro); }
  .deep { fill:var(--ink); }
  .frio { fill:var(--frio); }
  .pin { fill:var(--quente); }
  .blk { rx:var(--radius-lg); }
  .ring { fill:none; stroke:var(--bg); stroke-width:8; }
  .words { position:absolute; left:var(--space-12); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:600; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 8px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ouro 200×264 bled off the top (a marca, o maior) · ink 224×200 bleeding off the right (a tinta da interface) · frio 96×40 once (o contraponto calmo) · quente disc r=12 (o lead quente) — ≈38% of 960×288
  arrangement one tall ouro slab with an ink slab beside it, bottoms on one line space-12 above the edge, space-4 gutter; frio tucked above the ink slab
  pattern     concentric rings (a literal motif: o raio de busca em volta do pin no mapa) — rings in the ground colour cut through both slabs, centred on the quente pin in the gutter
  scales      ring pitch space-12 (48), four rings, stroke space-2 (8); gutter space-4; corners radius-lg; disc r = space-3
-->
<defs><clipPath id="c"><rect x="24" y="-24" width="200" height="264" rx="10"/><rect x="240" y="40" width="264" height="200" rx="10"/></clipPath></defs>
<rect class="ouro blk" x="24" y="-24" width="200" height="264" rx="10"/>
<rect class="deep blk" x="240" y="40" width="264" height="200" rx="10"/>
<rect class="frio" x="240" y="0" width="96" height="24" rx="4"/>
<g clip-path="url(#c)">
<circle class="ring" cx="232" cy="240" r="48"/>
<circle class="ring" cx="232" cy="240" r="96"/>
<circle class="ring" cx="232" cy="240" r="144"/>
<circle class="ring" cx="232" cy="240" r="192"/>
</g>
<circle class="pin" cx="232" cy="240" r="12"/>
</svg>
</div>
<div class="words">
<h1 class="name"><span class="pr-logo" role="img" aria-label="Prospecta"><img class="pr-logo-light" src="/_blob/6e2ece314e2d9f9a23e6ec30ecd204c7" alt="" height="104" width="352"><img class="pr-logo-dark" src="/_blob/abeadfb51bb916d3dd620512c8999617" alt="" height="104" width="352"></span></h1>
<p class="tag">Leads locais, ordenados por oportunidade.</p>
</div>
</div>
</body>
</html>
