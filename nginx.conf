server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmo papel do proxy do Vite em dev: o navegador fala com /engine e o nginx
  # repassa para o container do motor, que não envia cabeçalhos CORS.
  location /engine/ {
    proxy_pass http://google-maps-scraper:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Arquivos com hash no nome podem ficar em cache para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: qualquer rota do React Router cai no index.html.
  location / {
    try_files $uri /index.html;
  }
}
